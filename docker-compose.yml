name: multillm

services:
  # One-shot job: renders llm-router/config.yaml from the BACKEND_* vars in
  # .env (see scripts/render-config.sh) before the router starts.
  llmrouter-init:
    image: alpine:3.20
    container_name: llmrouter-init
    restart: "no"
    # Optional: without .env the render fails with a clear message instead
    # of breaking every compose command on a fresh clone.
    env_file:
      - path: .env
        required: false
    environment:
      CONFIG_OUT: /config/config.yaml
    entrypoint: ["sh", "/opt/render-config.sh"]
    volumes:
      - ./scripts/render-config.sh:/opt/render-config.sh:ro
      - ./llm-router/config:/config

  llmrouter:
    image: llm-router/llm-router:latest
    container_name: llmrouter
    restart: unless-stopped
    ports:
      - "${LLMROUTER_HOST_PORT:-9000}:8000"
    environment:
      LLM_ROUTER_HOST: "0.0.0.0"
      LLM_ROUTER_PORT: "8000"
      LLM_ROUTER_LOG_LEVEL: "info"
    volumes:
      - ./llm-router/config:/root/.llm-router/config
    # Lets the container reach backends running natively on the host
    # (MTPLX, LM Studio, oMLX) via http://host.docker.internal on any platform.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      llmrouter-init:
        condition: service_completed_successfully

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "${OPENWEBUI_HOST_PORT:-3000}:8080"
    environment:
      OPENAI_API_BASE_URL: "http://llmrouter:8000/v1"
      OPENAI_API_KEY: "${ROUTER_API_KEY:-}"
      WEBUI_AUTH: "${WEBUI_AUTH:-true}"
      ENABLE_OLLAMA_API: "false"
    volumes:
      - open-webui-data:/app/data
    depends_on:
      - llmrouter

volumes:
  open-webui-data: