name: multillm

services:
  # One-shot job: renders llm-router/config.yaml from the BACKEND_* vars in
  # .env (see scripts/render-config.sh) before the router starts.
  llmrouter-init:
    image: alpine:3.20
    container_name: llmrouter-init
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      ENV_FILE: /app/.env
      CONFIG_OUT: /config/config.yaml
    entrypoint: ["sh", "/opt/render-config.sh"]
    volumes:
      - ./.env:/app/.env:ro
      - ./scripts/render-config.sh:/opt/render-config.sh:ro
      - ./llm-router/config:/config

  llmrouter:
    image: ghcr.io/berriai/litellm:v1.110.2
    container_name: llmrouter
    restart: unless-stopped
    ports:
      - "${LLMROUTER_HOST_PORT:-9001}:4000"
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_LOG: info
    volumes:
      - ./llm-router/config/config.yaml:/app/config.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      llmrouter-init:
        condition: service_completed_successfully

  # mlx-vlm: containerized mlx-vlm server for Gemma 4 12B.
  #
  # IMPORTANT: mlx-vlm cannot currently run inside a Docker container on
  # Docker Desktop for macOS. Apple's mlx framework requires the macOS
  # Metal framework (libmlx.so), which is not available inside Linux
  # containers, and Docker Desktop does not support GPU passthrough to
  # Linux containers. The service is kept here so the stack validates and
  # starts cleanly, but the container will exit immediately on startup.
  # See README.md "Notes" for details.
  mlx-vlm:
    build:
      context: .
      dockerfile: Dockerfile.mlx-vlm
    container_name: mlx-vlm
    restart: "no"
    platform: linux/arm64
    environment:
      MLXVLM_MODEL: "${MLXVLM_MODEL:-mlx-community/gemma-4-12B-it-qat-4bit}"
    ports:
      - "${MLXVLM_HOST_PORT:-8080}:8080"
    volumes:
      - ${HOME:-/root}/.cache/huggingface:/root/.cache/huggingface:ro
    depends_on:
      llmrouter-init:
        condition: service_completed_successfully

  open-webui:
    image: ghcr.io/open-webui/open-webui:git-0666e59
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "${OPENWEBUI_HOST_PORT:-3000}:8080"
    environment:
      OPENAI_API_BASE_URL: "http://llmrouter:4000/v1"
      OPENAI_API_KEY: "${ROUTER_API_KEY:-}"
      WEBUI_AUTH: "${WEBUI_AUTH:-true}"
      ENABLE_OLLAMA_API: "false"
    volumes:
      - open-webui-data:/app/data
    depends_on:
      - llmrouter

volumes:
  open-webui-data:
