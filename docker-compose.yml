name: multillm

services:
  # One-shot job: renders llm-router/config.yaml from the BACKEND_* vars in
  # .env (see scripts/render-config.sh) before the router starts.
  llmrouter-init:
    image: alpine:3.20
    container_name: llmrouter-init
    restart: "no"
    env_file:
      - path: .env
        required: false
    environment:
      ENV_FILE: /app/.env
      CONFIG_OUT: /config/config.yaml
    entrypoint: ["sh", "/opt/render-config.sh"]
    volumes:
      - ./.env:/app/.env:ro
      - ./scripts/render-config.sh:/opt/render-config.sh:ro
      - ./llm-router/config:/config

  llmrouter:
    image: ghcr.io/berriai/litellm:v1.110.2
    container_name: llmrouter
    restart: unless-stopped
    ports:
      - "${LLMROUTER_HOST_PORT:-9001}:4000"
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      LITELLM_LOG: info
    volumes:
      - ./llm-router/config/config.yaml:/app/config.yaml
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      llmrouter-init:
        condition: service_completed_successfully
      llama-server:
        condition: service_started

  # Optional containerized llama-server backend (ghcr.io/ggml-org/llama.cpp:server).
  # Start it with: docker compose --profile llama-server up
  # Model files are bind-mounted from ./models/llama-server/ (see README.md).
  llama-server:
    image: ghcr.io/ggml-org/llama.cpp:server:latest
    container_name: llama-server
    restart: unless-stopped
    profiles:
      - llama-server
    ports:
      - "${LLAMASERVER_HOST_PORT:-8080}:8080"
    command: >
      --model /models/${LLAMASERVER_MODEL:-gemma4-12b-it-Q4_K_M.gguf}
      --host 0.0.0.0
      --port 8080
      --threads ${LLAMASERVER_THREADS:-4}
    volumes:
      - ./models/llama-server:/models:ro
    depends_on:
      - llmrouter-init

  open-webui:
    image: ghcr.io/open-webui/open-webui:git-0666e59
    container_name: open-webui
    restart: unless-stopped
    ports:
      - "${OPENWEBUI_HOST_PORT:-3000}:8080"
    environment:
      OPENAI_API_BASE_URL: "http://llmrouter:4000/v1"
      OPENAI_API_KEY: "${ROUTER_API_KEY:-}"
      WEBUI_AUTH: "${WEBUI_AUTH:-true}"
      ENABLE_OLLAMA_API: "false"
    volumes:
      - open-webui-data:/app/data
    depends_on:
      - llmrouter

volumes:
  open-webui-data:
