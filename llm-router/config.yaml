# SPDX-License-Identifier: Apache-2.0
# LLMRouter configuration (https://github.com/llm-router/llm-router).
# Mounted at /root/.llm-router/config inside the llmrouter container.
#
# `host.docker.internal` resolves to the Docker host (see extra_hosts in
# docker-compose.yml). Adjust base_url and ports to match your local
# servers. The LLMRouter web UI (http://localhost:9000) edits this same
# file at runtime.

version: 1

api_keys:
  # Used by Open WebUI (and any other client). CHANGE this key before
  # exposing the stack beyond a trusted LAN, and keep .env in sync.
  - id: "1"
    alias: "webui"
    key: "sk-935bc9b7cc7dcf2c0a0737b2dd700c21ff072a1b0362f21b"
    limit: -1
    expires_at: -1

model_groups:
  # MTPLX — native Apple Silicon server, default port 8000.
  # `mtplx serve --port 8000`
  - name: "mtplx"
    api_key_id: "1"
    endpoints:
      - id: "1"
        type: "openai"
        base_url: "http://host.docker.internal:8000/v1"
        endpoint: ""
        api_key: "mtplx"
        context_length: 131072
        model_names: []
        load_balance: "round_robin"
        load_balancing_weight: 1

  # LM Studio — Developer tab > Start Server, default port 1234.
  # Any API key value is accepted by LM Studio.
  - name: "lmstudio"
    api_key_id: "1"
    endpoints:
      - id: "1"
        type: "openai"
        base_url: "http://host.docker.internal:1234/v1"
        endpoint: ""
        api_key: "lm-studio"
        context_length: 131072
        model_names: []
        load_balance: "round_robin"
        load_balancing_weight: 1

# To add another server, copy a group and give it a new name, a fresh
# endpoint id, and its own base_url — or append an endpoint to an existing
# group to load-balance across several copies of the same backend.
